  Name: "取材中（昇華）"

seSunny:
  Description: "當一名敵人被擊敗時，獲得 |c:1| 點|火力|。"
  Name: "日噬（昇華）"

seStar:
  Description: "每有一名敵人被擊敗，{OwnerName}的回合開始時，對{PlayerName}施加 |c:1| 層|鎖定|。\n（{Count} 層）"
  Name: "幸運星（昇華）"

seLuna:
  Description: "每有一名敵人被擊敗，{OwnerName}的回合開始時，獲得 |c:3| 點|護盾|。\n（{Count} 點）"
  Name: "月噬（昇華）"

seRin:
  Description: "當一名|怨靈|被擊敗時，所有|怨靈|獲得 |c:1| 點火力，{OwnerName}失去 |c:1| 點火力。"
  Name: "地獄灼熱（昇華）"

seYoumu:
  Description: "每當{PlayerName}|閃避|傷害時，將戰場上隨機一張牌|放逐|，直到下輪結束。"
  Name: "樓觀劍（昇華）"

seNitori:
  Description: "其他敵人受到的攻擊傷害降低一半，{OwnerName}受到{SelfName}減少的傷害。\n當其他敵人存在時，{OwnerName}受到的傷害不會超過她最大生命值的 |c:20|%。"
  Name: "防禦矩陣（昇華）"

seKoXi:
  Description: "當{OwnerName}造成未被格擋的傷害時，獲得 |c:1| 層|閃避|。"
  Name: "喜（昇華）"

seKoNu:
  Description: "在抽牌階段外每抽一張牌，所有敵人獲得 |c:1| 點生命值，{OwnerName}對{PlayerName}造成 |c:1| 點傷害。"
  Name: "怒（昇華）"

seKoYou:
  Description: "在回合開始外獲得法力時，棄掉最左側的手牌。"
  Name: "憂（昇華）"

seKoSerious:
  Description: "戰場上未被|放逐|的|狀態|牌數少於 |c:2| 張時，無法在抽牌階段外抽牌。\n在回合開始外不能獲得法力。"
  Name: "認真（昇華）"

seDoremy:
  Description: "{OwnerName}擁有|護盾|時打出的所有牌將獲得|虛無|。"
  Name: "造夢者（昇華）"

seClownpiece:
  Description: "每有 |c:2| 名敵人，每輪結束時戰場上隨機一張未被|放逐|的|狀態|牌失去|放逐|。"
  Name: "瘋狂火炬（昇華）"

seEiki:
  Description: "擁有|鏡像|的敵人受到的傷害降低一半。"
  Name: "是非曲直（昇華）"

seReimu:
  Description: "當一名|玉|敵人被擊敗時，{OwnerName}獲得 |c:3| 點|暫得火力|。\n回合結束有剩餘法力時，{OwnerName}獲得 |c:3| 點|護盾|。"
  Name: "博麗御幣（昇華）"

seMarisa:
  Description: "戰場上每有一種未被|放逐|的|狀態|牌，{OwnerName}攻擊造成的傷害提升 |c:2| 點。\n（提升 {Count} 點）"
  Name: "壓縮（昇華）"

seSakuya:
  Description: "戰場上每有一張未被|放逐|的|時間封鎖|，{OwnerName}受到的傷害減少 |c:10|%，造成的傷害提高 |c:10|%。\n（各為 {Count}%）"
  Name: "銀色封鎖（昇華）"

seCirno:
  Description: "每當{OwnerName}受到 |c:99| 點未被阻擋的傷害時，獲得 |c:1| 回合|寒冰屏障|。\n（受到 {Count} 點未被阻擋的傷害後獲得）"
  Name: "寒冰屏障（昇華）"

sesbKoishi:
  Description: "{OwnerName}的回合開始時，將一張被|放逐|的非|狀態|非|厄運|牌洗入抽牌堆，|放逐|戰場上的另一張非|狀態|非|厄運|牌。"
  Name: "難以捉摸（昇華）"

seYuyuko:
  Description: "{PlayerName}受到未被格擋的傷害時，獲得 |c:1| 回合負面狀態。從|虛弱|、|脆弱|和|易傷|中隨機。"
  Name: "生者必滅（昇華）"

seTenshi:
  Description: "當{OwnerName}的意圖為攻擊|符卡|時，她受到的傷害降低一半。\n當{OwnerName}單次受到的傷害高於 |c:52|，獲得 |c:1| 點|火力|。"
  Name: "仙桃（昇華）"

seMegumu:
  Description: "{OwnerName}用過|符卡|的回合結束時，戰場上的所有|狀態|牌失去|放逐|和|虛無|。\n當|賄賂|被打出時，戰場上的所有|狀態|牌獲得|虛無|。"
  Name: "閃光三腳架（昇華)"

seRemilia:
