  Name: "我很好奇！（昇華）"

seJunko:
  Description: "當{PlayerName}擁有 |c:3| 或更多層|溢出的瑕穢|，{PlayerName}的回合開始時，|純化| |c:5|。當{PlayerName}達到 |c:4| 層|溢出的瑕穢|時，|純化|一點基礎法力。"
  Name: "溢出的瑕穢（昇華）"

seSeija:
  Description: "每當{OwnerName}受到 |c:300| 點未被阻擋的傷害時，獲得一個隨機展品。\n（受到 {Count} 點未被阻擋的傷害後獲得）"
  Name: "道具的解放者（昇華）"
