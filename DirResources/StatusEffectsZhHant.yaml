  Description: "當{OwnerName}造成未被格擋的傷害時，對{PlayerName}施加 |c:2| 回合|虛弱|。"
  Name: "疾病纏身（昇華）"

seRedOrb:
  Description: "當一個擁有|藍玉之力|的|藍陰陽玉|被擊敗時，吸取其|靈力|作為{SelfName}的基礎|護盾|獲得以激活{SelfName}。\n|激活後|：{OwnerName}的回合結束時，獲得 {Count} 點|護盾|，然後此|護盾|獲得增加 |c:1| 點。"
  Name: "藍玉之力繼承（昇華）"

seBlueOrb:
  Description: "當一個擁有|紅玉之力|的|紅陰陽玉|被擊敗時，吸取其|火力|作為{SelfName}的基礎傷害以激活{SelfName}。\n|激活後|：{OwnerName}的回合結束時，對{PlayerName}造成 {Count} 點傷害，然後此傷害增加 |c:1| 點。"
  Name: "紅玉之力繼承（昇華）"

seFraudRabbit:
  Description: "當{OwnerName}被擊敗時，所有敵人獲得 |c:3| 層|閃避|。"
  Name: "沉重的代價（昇華）"

seBat:
  Description: "在抽牌階段外抽牌，而{OwnerName}沒有|閃避|時，獲得 |c:1| 層|閃避|。"
  Name: "動態捕捉（昇華）"

seBatLord:
  Description: "在抽牌階段外抽牌時，{PlayerName}失去 |c:1| 點生命值，損失生命值最多的|蝙蝠|獲得這回合抽牌階段外抽牌數量的生命值。({Count})"
  Name: "血腥之風（昇華）"

seDoll:
  Description: "當{OwnerName}造成未被格擋的傷害時，對{PlayerName}施加 |c:1| 層|中毒|和 |c:1| 回合|易傷|。"
  Name: "死亡劇毒（昇華）"

seWaterGirl:
  Description: "當{OwnerName}造成未被格擋的傷害時，{PlayerName}的|溺水|提升 |c:1| 層。"
  Name: "石沉大海（昇華）"

seScout:
  Description: "每打出 {limit} 張牌，對{PlayerName}施加 |c:1| 層|鎖定|。\n（打出 {Count} 張牌後施加）"
  Name: "暴擊模組（昇華）"

sePurifier:
  Description: "在回合開始外獲得法力時，|淨化| |c:1|。"
  Name: "應激模組（昇華）"

seTerminator:
  Description: "當{PlayerName}獲得|閃避|時，對{PlayerName}施加 |c:1| 層|鎖定|。"
  Name: "自瞄模組（昇華）"

seYaoshi:
  Description: "敵人受到的傷害不會超過他們最大生命值的 |c:20|%。"
  Name: "固守（昇華）"

seFox:
  Description: "{OwnerName}的回合結束時，如果這輪內{OwnerName}沒受到未被格擋的傷害，獲得 |c:1| 點|火力|。"
  Name: "妖狐魅惑（昇華）"

seSPWhite:
  Description: '每在回合開始外獲得一點法力，{PlayerName}失去 |c:5| 點<sprite="Point" name="Gold">。'
  Name: "富貴的詛咒（昇華）"

seSPPurple:
  Description: "每在抽牌階段外抽一張牌，{PlayerName}失去 |c:1| 點生命值。"
  Name: "優雅的詛咒（昇華）"

seLoveGirl:
  Description: "每打出一張|情書|，{OwnerName}受到和造成的傷害提高 |c:10|%。\n（提高 {Count}%）"
  Name: "陷入情場（昇華）"

seRaven3:
  Description: "所有初始費用低於|烏鴉|數量的非|狀態|牌，費用增加{Mana}。"
  Name: "唯快不破（昇華）"

seBigCrow:
  Description: "當{OwnerName}受到未被格擋的傷害時，{PlayerName}受到等同於其一半的攻擊傷害。"
  Name: "無堅不摧（昇華）"

seKanako:
  Description: "在回合開始外獲得法力時，對{PlayerName}施加 |c:2| 點|暫失火力|。"
  Name: "神之氣場（昇華）"

seSuwako:
  Description: "戰鬥開始時，戰場上 |c:4| 張隨機的牌被作祟，變為無用之物。\n每在抽牌階段外抽 {limit} 張牌，一張隨機的手牌被作祟，變為無用之物。"
  Name: "作祟（昇華）"

seAya:
