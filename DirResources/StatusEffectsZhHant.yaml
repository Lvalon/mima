seevilspirit:
  Description: "{OwnerName}獲得的|格檔|和|護盾|將變為對{OwnerName}造成傷害，單次上限為 {bscap} 點傷害。\n當{OwnerName}被擊敗時，回滿生命值，然後所有敵人的生命值和最大生命值降低{OwnerName}的最大生命值的一半。\n當{OwnerName}以卡牌效果、自身狀態、展品或自己擊敗自己時，獲得 |n:1| 點最大生命值（每場戰鬥一次），否則失去一半最大生命值。\n當{OwnerName}的最大生命值少於 |n:6| 點時，死亡。"
  Brief: "{OwnerName}獲得的|格檔|和|護盾|將變為對{OwnerName}造成傷害，單次上限為 {bscap} 點傷害。\n當{OwnerName}被擊敗時，回滿生命值，然後所有敵人的生命值和最大生命值降低{OwnerName}的最大生命值的一半。\n當{OwnerName}以卡牌效果、自身狀態、展品或自己擊敗自己時，獲得 |n:1| 點最大生命值（每場戰鬥一次），否則失去一半最大生命值。\n當{OwnerName}的最大生命值少於 |n:6| 點時，死亡。"
  Name: 惡靈

