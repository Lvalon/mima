# 繁體中文

Shop:
  LiteShopButton:
    Text: "Roguelite 商店"
    Active: "Roguelite 商店 （啟用中）"
    Inactive: "Roguelite 商店 （未啟用）"
    Desc:
      Text: |-
        |挑戰者模式|下，遊戲結束時獲得的<sprite="Point" name="Point">將被儲存，能在 |Roguelite 商店| 中使用以強化作為|挑戰者|的玩家。
        |挑戰者模式|：玩家角色的首個行動階段將被跳過。
      Normalize: "|p:（行動階段的跳過已被難度調整的正常化取消）|"
    Effect: "<b>效果</b>："
  difficulty:
    Text: "難度調整"
    Desc: "|難度調整|能調整|挑戰者模式|的難度，但也會影響<sprite=\"Point\" name=\"Point\">的儲存或其他收益。"
    reverse:
      Text: "正常化"
      Desc: "|挑戰者模式|不會再跳過玩家的首次行動，不過遊戲勝利時只會儲存 |c:50|% 的<sprite=\"Point\" name=\"Point\">，且遊戲失敗時不會儲存<sprite=\"Point\" name=\"Point\">。"
    ascension:
      Text: "昇華"
      Desc: "敵人將被昇華，他們將獲得獨特的狀態，提供一個全方位的挑戰。多儲存 |c:100|% 的<sprite=\"Point\" name=\"Point\">。"
  init:
    Text: "初始加成"
    Desc: "|初始加成|能在遊戲開始時提供永久的即時數值優勢，改善遊戲的整體體驗。"
    fp:
      Text: "攻哈"
      Desc: "戰鬥開始時獲得 {0} 點|火力|。"
      Next: "<b>|c:下一級|</b>：{1} 點|火力|"
    sp:
      Text: "防殺"
      Desc: "戰鬥開始時獲得 {0} 點|靈力|。"
      Next: "<b>|c:下一級|</b>：{1} 點|靈力|"
    hp:
      Text: "紅色格擋條"
      Desc: "遊戲開始時，最大生命值提升 {0}% 。"
      Next: "<b>|c:下一級|</b>：提升 {1}%"
    gold:
      Text: "保護金幣"
      Desc: "遊戲開始時獲得 {0} 點<sprite=\"Point\" name=\"Gold\">。"
      Next: "<b>|c:下一級|</b>：{1} 點<sprite=\"Point\" name=\"Gold\">"
    card:
      Text: "盡孝"
      Desc: "遊戲開始時可從上一局的牌庫中選擇 {0} 張能力牌加入這局的牌庫。"
      Next: "<b>|c:下一級|</b>：{1} 張"
    exhibit:
      Text: "先賺一個精英"
      Desc: "遊戲開始時可獲得隨機 {0} 個上一局未擁有的非|光耀|非|祕寶|展品。"
      Next: "<b>|c:下一級|</b>：隨機 {1} 個"
    solo:
      Text: "我獨自做任務"
      Desc: "遊戲開始時獲得|任務欄|展品，可在戰鬥外點擊以打開面板接取|任務|。"
  discount:
    Text: "折扣"
    Desc: "|折扣|能減少商店中各種商品和服務的費用，提高<sprite=\"Point\" name=\"Point\">的使用效率。"
    sc:
      Text: "大招當平a"
      Desc: "使用|符卡|所需的<sprite=\"Point\" name=\"Power\">減少 {0}% 。"
      Next: "<b>|c:下一級|</b>：減少 {1}%"
    shop:
      Text: "常客"
      Desc: "所有山城商店的商品打折 {0}% 。"
      Next: "<b>|c:下一級|</b>：打折 {1}%"
    upgrade:
      Text: "競爭對手"
      Desc: "山城商店的升級卡牌服務費用減少 {0} 點<sprite=\"Point\" name=\"Gold\">。"
      Next: "<b>|c:下一級|</b>：減少 {1} 點<sprite=\"Point\" name=\"Gold\">"
    remove:
      Text: "擴大優勢"
      Desc: "山城商店的移除卡牌服務費用減少 {0} 點<sprite=\"Point\" name=\"Gold\">。"
      Next: "<b>|c:下一級|</b>：減少 {1} 點<sprite=\"Point\" name=\"Gold\">"
  feature:
    Text: "功能升級"
    Desc: "|功能升級|能增強特定的遊戲機制，在遊戲過程中提供額外的收益。"
    teasync:
      Text: "手快全點"
      Desc: "在隙間小屋內升級牌時也會|飲茶|。"
    gapple:
      Text: "金蘋果茶"
      Desc: "在|飲茶|時每回復 {0} 點生命值，獲得 |c:1| 點最大生命值。"
      Next: "<b>|c:下一級|</b>：{1} 點"
    sponsor:
      Text: "隙間贊助"
      Desc: "在隙間小屋內升級牌時，獲得 {0} 點<sprite=\"Point\" name=\"Gold\">。"
      Next: "<b>|c:下一級|</b>：{1} 點<sprite=\"Point\" name=\"Gold\">"
  battle:
    Text: "戰鬥加成"
    Desc: "|戰鬥加成|能在戰鬥中提供額外的優勢，減少戰損和改善資源管理。"
    block:
      Text: "時刻警戒"
      Desc: "戰鬥開始和挑戰者的第一回合開始時，獲得 {0} 點|格擋|。"
      Next: "<b>|c:下一級|</b>：{1} 點|格擋|"
    graze:
      Text: "敏捷身手"
      Desc: "戰鬥開始和挑戰者的第一回合開始時，獲得 {0} 層閃避。"
      Next: "<b>|c:下一級|</b>：{1} 層|閃避|"
    heal:
      Text: "脫戰回復"
      Desc: "戰鬥結束時，獲得 {0} 點生命值。"
      Next: "<b>|c:下一級|</b>：{1} 點生命值"
    seedraw:
      Text: "開眼了"
      Desc: "可以查看抽牌堆的實際牌序。"
    rolldiscard:
      Text: "roll了"
      Desc: "戰鬥開始時可把抽牌堆的牌置入棄牌堆。"
    hacks:
      Text: "回合結束時"
      Desc: "玩家的第一回合結束時，有 {0}% 機率可以打出戰場上的 |c:1| 張隨機能力牌。"
      Next: "<b>|c:下一級|</b>：{1}% 機率"
    ChallengerModeWatermark:
      HoverHint: "挑戰者模式"
  alter:
    Text: "設定更改"
    Desc: "|設定更改|能扭曲和更改部份遊戲設定，讓|挑戰者|從中得益。"
    freechoice:
      Text: "我就知道"
      Desc: "不需要搜索真兇用的道具也能成功搜索真兇。"
    wings:
      Text: "送你一對翼"
      Desc: "選擇下一關時可以無視路線。"
    blankcard:
      Text: "無限體驗"
      Desc: "獎勵和售賣的卡牌從所有顏色中隨機。"
  Loadout:
    Text: "當前配置"
    None: "無！"
  refund:
    Text: "全部退款"
    Desc: "退款所有在 |Roguelite 商店| 中購買過的升級。"
  ChallengerModeHistory:
    Active: "挑戰者模式已啟用"
    Title: "挑戰者模式"
  QuestHistory:
    Active: "已完成任務"
    Title: "已完成任務"
  Money: "金錢：{0} <sprite=\"Point\" name=\"Point\">"
  Tier: "<b>|f:等級|</b>：{0} / {1}"
  NextTier: " ── {0} <sprite=\"Point\" name=\"Point\">"
  NotEnoughBP: " (<sprite=\"Point\" name=\"Point\">不足)"
  MaxTier: " ── <b>|最高等級|</b>"
  InDevelopmentSuffix: "（開發中）"
  BuyButton:
    Text: "購買升級"
    Desc: |-
      購買後此商品將提升一級。
      遊戲進行中時不能購買。
  RefundButton:
    Text: "全額退款"
    Desc: |-
      退款後此商品將降低一級。
      遊戲進行中時不能退款。
  ChallengerModeToggle:
    Text: "挑戰者模式"
    Desc: "啟用或禁用挑戰者模式。在進行中的遊戲期間無法更改。"
    "On": "|開啟中！|"
    ButtonOn: "禁用模式"
    "Off": "關閉中。"
    ButtonOff: "啟用模式"
  ChallengerModeToggleFront: "|挑戰者模式|目前⋯⋯"
  ChallengerModeToggleBack: "點擊下方按鈕以更改模式，或|按住 Shift 鍵點擊|主頁面的商店按鈕也能更改模式！"
MessageDialog:
  Shop:
    refund:
      Confirm: "確定要退款所有的升級嗎？"
