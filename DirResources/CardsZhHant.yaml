cardshinki:
  Name: 魔界之神神綺
  Description: "{FriendS}|手牌中|：打出一張牌後，失去 {Value1} 點生命值，升級隨機 {Value1} 張手牌，獲得 {Value1} 點|暫得火力|。\n{FriendP}選擇戰場上一張顏色包含{ManaW}/{ManaB}/{ManaR}的牌移回手中。"
