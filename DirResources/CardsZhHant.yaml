  UpgradedDescription: "失去 {Value1} 點生命值。\n隨機對一名敵人施加|寒冷| {Value1} 次。\n|退治|時，獲得 {Value2} 點最大生命值，抽 {Value1} 張牌。"

carddoubleit:
  Name: 加倍，再給...
  Description: "失去 {Value2} 點生命值。\n目標失去 {Value1} 點生命值。\n加倍並再次生效於今次效果處理內，一個沒被指定的敵人上。\n|退治|時，獲得等於再次生效次數除以 |n:3| 的最大生命值。"
  UpgradedDescription: "失去 {Value2} 點生命值。\n目標失去 {Value1} 點生命值。\n加倍並再次生效於今次效果處理內，一個沒被指定|兩次|的敵人上。\n|退治|時，獲得等於再次生效次數除以 |n:3| 的最大生命值。"
  DetailText: "當一名敵人被指定後（升級後則是指定兩次後），{SelfName}不會再指定該敵人。"

cardtruefalse:
  Name: 真真假假 假假真真
  Description: "失去 {Value2} 點最大生命值，然後目標的生命值變為目標已損的生命值。{eff1}\n失去其生命值差別的生命值。{eff2}\n將{SelfName}移出戰鬥。"
  DetailText: "{SelfName}不會在戰鬥中被隨機獲得，不能成為複製效果的對象。"

cardignition:
  Name: 點燃
  Description: "對所有敵人施加 {Value1} 層|易傷|.\n獲得 {Value2} 層|充能|和|魔爆|。\n對所有敵人造成等於|魔爆|層數的傷害。\n|退治|時，|側載 {svalue}|：選擇一張手牌，獲得等於其總費用的最大生命值，|放逐|它。"
  UpgradedDescription: "對所有敵人施加 {Value1} 層|易傷|.\n獲得 {Value2} 層|充能|，|暫得火力|和|魔爆|。\n對所有敵人造成等於|魔爆|層數的傷害。\n|退治|時，|側載 {svalue}|：選擇一張手牌，獲得等於其總費用的最大生命值，|放逐|它。"
  ExtraDescription1: "不要|側載 {svalue}|。"
  ExtraDescription2: "|側載 {svalue}|：選擇一張手牌，獲得等於其總費用的最大生命值，|放逐|它。"

cardintoxicated:
