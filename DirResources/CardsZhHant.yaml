  ExtraDescription2: "|獎勵|：相當於牌庫數量的最大生命值。從牌庫選擇至多 {Value2} 張牌|升級|。"

cardquest15:
  Name: "序列 15：潔淨世界"
  Description: ""
  ExtraDescription1: |-
    |挑戰|：下 {Value1} 場戰鬥結束時，
    若戰場上未被|放逐|的牌少於 {Value2} 張則失去 {Value2} 點生命值；
    若戰場上沒有|能力|牌則失去所有<sprite="Point" name="Power">；
    若戰鬥結束時的回合打出多於 {Value10} 張牌則失去所有<sprite="Point" name="Gold">。
  ExtraDescription2: '|獎勵|：{Value2} 點最大生命值，恢復滿生命值，牌庫每有一張|能力|牌獲得 {Value2} 點<sprite="Point" name="Power">。'

cardquest16:
  Name: "序列 16：回合結束時"
  Description: ""
  ExtraDescription1: "|條件|：在 {Value1} 場戰鬥的第一回合結束時，沒有在抽牌階段外抽牌，且抽牌堆內至少有 |n:1| 張|能力|牌。"
  ExtraDescription2: "|p:永久獎勵|：{PlayerName}的第一回合結束時，若沒有在抽牌階段外抽牌，且抽牌堆內至少有 |n:1| 張|能力|牌，則打出抽牌堆內的一張隨機|能力|牌。"

cardquest17:
  Name: "序列 17：命中注定"
  Description: ""
