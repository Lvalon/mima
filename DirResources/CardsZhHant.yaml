  Name: 暮光火花
  Description: "|側載 爆發|：放逐所有手牌，失去所有法力。每失去{Mana}，將傷害提升 {Value2}%，如果基礎傷害乘法力的倍數和|爆發|的傷害倍數{showtext}超過敵人的生命值，擊敗敵人。\n對所有敵人造成 {Damage} 點傷害。\n如果|< 10%|{hp10ns}：選擇|側載 爆發|時不會離開|爆發|。"
  UpgradedDescription: "獲得 {Value4} 層|充能|。\n|側載 爆發|：放逐所有手牌，失去所有法力。每失去{Mana}，將傷害提升 {Value2}%，如果基礎傷害乘法力的倍數和|爆發|的傷害倍數{showtext}超過敵人的生命值，擊敗敵人。\n對所有敵人造成 {Damage} 點傷害。\n如果|< 10%|{hp10ns}：選擇|側載 爆發|時不會離開|爆發|。"
  ExtraDescription1: "不要|側載 爆發|。\n如果|< 10%|{hp10ns}：選擇|側載 爆發|時不會離開|爆發|。"
  ExtraDescription2: "|側載 爆發|：放逐所有手牌，失去所有法力。每失去{Mana}，將傷害提升 {Value2}%，如果基礎傷害乘法力的倍數和|爆發|的傷害倍數{showtext2}超過敵人的生命值，擊敗敵人。\n如果|< 10%|{hp10ns}：選擇|側載 爆發|時不會離開|爆發|。"

cardcdarkness:
