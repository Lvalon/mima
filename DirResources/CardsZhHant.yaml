cardquest20:
  Name: "序列 20：多餘的異變石"
  Description: ""
  ExtraDescription1: "|條件|：將{cardName}加入牌庫。"
  ExtraDescription2: "|獎勵|：將隨機 {Value2} 張|異變石|加入牌庫。"
  RandomCard: "隨機一張在備選池的卡牌"

cardstone1:
  Name: 雪風的雪魔
  Description: "|戰鬥開始時|：|放逐|{SelfName}，打出一張|暴風雪|。"

cardstone2:
  Name: 沉底的地靈
  Description: "|戰鬥開始時|：打出{SelfName}。\n每當{PlayerName}|閃避|傷害時，獲得 {Value1} 點|格檔|。"
  DetailText: "牌庫沒有|閃避|牌時，{SelfName}不會在備選池內。"

cardstone3:
