cardantispirit:
  Name: 反幽幻彈
  Description: "施加 {Value1} 層|中毒|。\n|升級|隨機 |n:1| 張手牌。\n進行一次|追加攻擊|。\n如果敵人沒被擊敗，則對另一名敵人再次生效。\n|退治|時，從|放逐|區選擇 |n:1| 張牌，獲得等於其總費用的最大生命值並將其移出戰鬥。"
  DetailText: "{SelfName}的效果會再次生效最多 |n:2| 次。"

cardbanquet:
  Name: 混入宴會
  Description: "進入|平靜|並獲得 {Value1} 回合的|光學迷彩|。\n這輪結束時，離開|平靜|。\n施加 {Value2} 層|中毒|，對每個敵人觸發一次|中毒|傷害。\n|退治|時，失去|光學迷彩|，離開|平靜|，進入|爆發|。"
  UpgradedDescription: "進入|平靜|並獲得 {Value1} 回合的|光學迷彩|。\n這輪結束時，離開|平靜|。\n對所有敵人施加 {Value2} 層|中毒|，對每個敵人觸發一次|中毒|傷害。\n|退治|時，失去|光學迷彩|，離開|平靜|，進入|爆發|。"

carddpillar:
  Name: 鑽石方柱
  Description: "對所有敵人造成 {Damage} 點傷害。\n對所有敵人施加|寒冷|。\n獲得 {Value1} 層|時域衝擊|。\n將 {Value2} 張|純淨鑽石|洗入抽牌堆。\n|退治|時，再次生效。"
  UpgradedDescription: "對所有敵人造成 {Damage} 點傷害。\n對所有敵人施加|寒冷|。\n獲得 {Value1} 層|時域衝擊|。\n將 {Value2} 張|純淨鑽石|洗入抽牌堆。\n|退治|時，再次生效，失去 {Value1} 點生命值，獲得|寒冷|。"

