carddragonslay:
  Name: 龍斬
  Description: "失去 {self} 點生命值。\n目標失去 {damage} 點生命值，如果失去的生命值超過目標的生命值，則變為擊敗目標。\n選擇 {Value2} 張手牌|放逐|，|放逐| {Value2} 張後加倍{SelfName}的失去生命值效果。\n將{SelfName}的|已打出|移除並移回手中。"
