  Description: "造成 {Damage} 點傷害。\n失去 {Value1} 點生命值。\n施加|寒冷|。\n|退治|時，每有一個擁有|寒冷|的敵人，獲得 {Value2} 點最大生命值。"

cardyukionna:
  Name: 雪女造訪
