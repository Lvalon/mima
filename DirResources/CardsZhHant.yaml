  Description: "對隨機一名敵人施加|寒冷|。\n對隨機敵人造成 {Damage} 點傷害 {Value1} 次。\n擁有|寒冷|的敵人受到 {Value2} 倍傷害。\n如果|< 50%|{hp50ns}：隨機施加改為對所有敵人施加|寒冷|。"
  UpgradedDescription: "對隨機一名敵人施加|寒冷|。\n對隨機敵人造成 {Damage} 點傷害 {Value1} 次。\n擁有|寒冷|的敵人受到 {Value2} 倍傷害。\n|退治|時，獲得 {Value4} 點最大生命值。\n如果|< 50%|{hp50ns}：隨機施加改為對所有敵人施加|寒冷|。"

cardicyrose:
