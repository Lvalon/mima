    Description: "Lose after Level 4 and within Act 1."
  hurryact2:
    Name: "Half-phantom T-Shirted"
    Description: "Lose in Act 2."
  hurryact3:
    Name: "So close, yet so far"
    Description: "Lose in Act 3."
  hurryact3win:
    Name: "In another castle?"
    Description: "Resolve the incident in Act 3."
  hurryact4:
    Name: "We'll get 'em next time"
