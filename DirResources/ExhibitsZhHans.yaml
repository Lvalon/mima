exmimaa:
  Name: 转生
  Description: |-
    提供基础法力{BaseMana}，|魅魔|的专属卡牌会加入牌池。
    奖励和售卖的卡牌从所有颜色中随机。
    |魅魔|有|创意|。
    |魅魔|战斗时拥有|恶灵|。
    {PlayerName}的|恶灵|生命值相关效果触发时，进入|超然物外|。

exmimab:
  Name: 深入深渊
  Description: |-
    提供基础法力{BaseMana}，|魅魔|的专属卡牌会加入牌池。
    奖励和售卖的卡牌从所有颜色中随机。
    |魅魔|有|创意|。
    |魅魔|战斗时拥有|恶灵|。
    |恶灵|的|格挡|和|护盾|至伤害转化上限减半。
    {PlayerName}的|恶灵|生命值相关效果触发时，进入|深渊|，延迟{PlayerName}的|恶灵|生命值相关效果至这轮结束时触发，且在触发该效果前不会被击败。
    {SelfName}的|业报|为每轮玩家在 |n:0| 点生命值时失去生命的次数。
    如果{SelfName}的|业报|大于{PlayerName}的最大生命值，{PlayerName}的最大生命值变为 |n:1|。
